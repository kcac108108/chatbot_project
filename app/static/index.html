<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교부기관 이력관리시스템 챗봇 (PoC)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f2f4f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1c3d5a;
    color: #fff;
    padding: 16px 20px;
    font-size: 18px;
    font-weight: 600;
  }
  header .sub {
    font-size: 12px;
    font-weight: 400;
    color: #b9c9d8;
    margin-top: 2px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 72%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .msg.user .bubble { background: #1c3d5a; color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: #fff; color: #222; border: 1px solid #e0e4e9; border-bottom-left-radius: 2px; }
  .msg.bot .bubble.error { background: #fdecea; border-color: #f5c2bd; color: #a12b1f; }
  .sources { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .source-chip {
    font-size: 11px;
    background: #eaf0f7;
    color: #2c4a6b;
    border: 1px solid #cfdcea;
    border-radius: 999px;
    padding: 3px 9px;
  }
  .sources-label { font-size: 11px; color: #8a94a0; margin-top: 8px; margin-bottom: 2px; }
  .typing { font-size: 13px; color: #8a94a0; padding: 4px 14px; }
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    background: #fff;
    border-top: 1px solid #e0e4e9;
  }
  #question {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccd3da;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #question:focus { border-color: #1c3d5a; }
  #send {
    padding: 10px 20px;
    background: #1c3d5a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled { background: #a9b6c2; cursor: default; }
  #send:hover:not(:disabled) { background: #163149; }
</style>
</head>
<body>
  <header>
    교부기관 이력관리시스템 챗봇 (PoC)
    <div class="sub">4개 메뉴 이력 데이터 기반 질의응답 — 근거 자료를 함께 표시합니다</div>
  </header>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="question" type="text" placeholder="질문을 입력하세요 (예: OO기관 관련 이력 알려줘)" autocomplete="off">
    <button id="send">전송</button>
  </div>

<script>
let sessionId = null;

const chatEl = document.getElementById("chat");
const questionEl = document.getElementById("question");
const sendEl = document.getElementById("send");

function addMessage(role, text, sources, isError) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  msg.appendChild(bubble);

  if (sources && sources.length > 0) {
    const label = document.createElement("div");
    label.className = "sources-label";
    label.textContent = "근거 자료";
    msg.appendChild(label);

    const box = document.createElement("div");
    box.className = "sources";
    sources.forEach(s => {
      const chip = document.createElement("span");
      chip.className = "source-chip";
      chip.textContent = `[${s.데이터유형}] ${s.원본ID}` + (s.기관명 ? ` · ${s.기관명}` : "");
      box.appendChild(chip);
    });
    msg.appendChild(box);
  }

  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
  return msg;
}

function addTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typing-indicator";
  el.textContent = "답변 작성 중...";
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

async function sendQuestion() {
  const question = questionEl.value.trim();
  if (!question) return;

  addMessage("user", question);
  questionEl.value = "";
  sendEl.disabled = true;
  addTyping();

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId }),
    });
    removeTyping();

    if (!resp.ok) {
      addMessage("bot", `오류가 발생했습니다. (HTTP ${resp.status})`, null, true);
      return;
    }

    const data = await resp.json();
    sessionId = data.session_id;
    addMessage("bot", data.answer, data.sources);
  } catch (err) {
    removeTyping();
    addMessage("bot", "서버에 연결할 수 없습니다.", null, true);
  } finally {
    sendEl.disabled = false;
    questionEl.focus();
  }
}

sendEl.addEventListener("click", sendQuestion);
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendQuestion();
});

addMessage("bot", "안녕하세요. 교부기관 이력관리시스템 챗봇입니다. 기관명, 연도, 담당자·요청자, 심의결과 등으로 이력을 검색할 수 있습니다.");
</script>
</body>
</html>
