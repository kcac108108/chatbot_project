<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이력관리시스템 챗봇 (PoC)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  :root {
    --page-bg: #eef1f4;
    --sidebar-bg: #ffffff;
    --ink: #1b2433;
    --ink-soft: #6b7684;
    --ink-faint: #9aa3ae;
    --rule: #e6e9ed;
    --widget-panel: #1c2836;
    --accent: #3b5bdb;
    --accent-soft: #e8ecfb;
    --mint: #34c9a3;
    --bot-bubble: #24313f;
    --ink-dark: #dde3ea;
    --ink-dark-soft: #8ea0b5;
    --danger: #ef5b5b;
    --danger-soft: rgba(239,91,91,.12);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    overflow: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .shell {
    width: 100%;
    height: 100vh;
    background: var(--sidebar-bg);
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ---------------- sidebar ---------------- */
  /* 배경을 명시해야 함 — 모바일(720px 이하)에서 .sidebar가 position:fixed로 떠서
     .shell의 grid 배경을 더 이상 상속받지 못해 뒤 콘텐츠가 비쳐 보이는 버그가 있었음
     (2026-10-15 즉흥 모바일 테스트로 발견, 데스크톱은 우연히 부모 배경이 그 자리를
     채워줘서 안 드러났음) */
  .sidebar {
    background: var(--sidebar-bg);
    padding: 20px 16px;
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    /* 네이티브 스크롤바는 완전히 숨김(아래 .cscroll-* 커스텀 스크롤바로 대체) — Chrome/Edge의
       "Fluent/오버레이 스크롤바" 기능이 켜진 환경에서는 ::-webkit-scrollbar로 폭·색을
       아무리 키워도 브라우저가 무시하고 얇은 네이티브 바만 그려서(2026-11-17 실사용 확인),
       순수 CSS로는 두껍고 또렷한 스크롤바를 보장할 수 없음 — JS로 직접 그린다. */
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; width: 0; }
  .sidebar-brand {
    display: flex; align-items: center; gap: 9px;
    margin-bottom: 22px; padding: 0 2px;
  }
  .sidebar-logo {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: #eef1f4 url("/static/bot-avatar.png") center / cover no-repeat;
  }
  .sidebar-brand b { font-size: 13.5px; letter-spacing: -.01em; }

  /* 구역(빠른 메뉴/자주 묻는 질문/최근 검색) 시인성 개선(2026-10-12) — 제목에 아이콘+포인트색을
     주고, 구역 사이에 얇은 구분선을 넣어 스크롤 중에도 구역 경계가 눈에 띄게 한다. */
  .sec-title-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sec-title-row svg { flex-shrink: 0; }
  .sidebar h3 { font-size: 10.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; margin: 0; }
  .sidebar h3.sec-menu { color: var(--accent); }
  .sidebar h3.sec-faq { color: #1d7a5f; }
  .sidebar h3.sec-recent { color: var(--ink-soft); }
  .sidebar h3.sec-search { color: var(--mint); }
  .quick-search-row { display: flex; gap: 6px; }
  #keyword-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 12.5px;
    padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px;
    background: #fff; color: var(--ink); outline: none;
  }
  #keyword-input:focus { border-color: rgba(52,201,163,.5); }
  #keyword-search-btn {
    flex-shrink: 0; width: 32px; border: none; border-radius: 8px;
    background: var(--mint); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  #keyword-search-btn:hover { background: #2aa88a; }
  #keyword-search-btn:disabled { opacity: .6; cursor: default; }
  .side-hint { font-size: 10.8px; color: var(--ink-faint); line-height: 1.5; margin-top: 7px; padding: 0 1px; }
  .side-section { margin-bottom: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .side-section:first-of-type { padding-top: 0; border-top: none; }
  .side-list { display: flex; flex-direction: column; gap: 4px; }
  .side-item {
    font-family: inherit; font-size: 12.5px; text-align: left; line-height: 1.45;
    background: #fff; border: 1px solid var(--rule); color: var(--ink-soft);
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .side-item:hover { background: var(--accent-soft); color: var(--accent); border-color: rgba(59,91,219,.3); }
  .side-item.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  #faq-list.side-list { gap: 7px; }
  .faq-item {
    background: var(--page-bg);
    border: 1px solid var(--rule);
    border-radius: 9px;
  }
  .faq-item:hover { background: var(--accent-soft); border-color: rgba(59,91,219,.3); }
  .side-recent {
    font-size: 11.3px; text-align: left; width: 100%; background: #fff; color: var(--ink);
    font-family: inherit; cursor: pointer;
    padding: 6px 9px; line-height: 1.5;
    border: 1px solid var(--rule); border-left: 3px solid var(--mint); border-radius: 0 8px 8px 0;
    transition: border-color .15s, color .15s, background .15s;
  }
  .side-recent:hover { background: var(--accent-soft); border-left-color: var(--mint); border-color: rgba(59,91,219,.3); border-left-width: 3px; }
  .side-empty { font-size: 11.5px; color: var(--ink-faint); padding: 4px 9px; }

  /* ---------------- widget (right) ---------------- */
  .widget-wrap {
    padding: 18px;
    background: linear-gradient(160deg, #f4f6f9, #e9edf2);
    display: flex;
    min-width: 0;
    min-height: 0;
  }
  .widget {
    flex: 1;
    background: #16202e;
    border-radius: 14px;
    box-shadow: 0 18px 44px -18px rgba(10,14,20,.5);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .widget-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; background: var(--widget-panel);
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  .menu-toggle {
    display: none;
    width: 28px; height: 28px; border-radius: 7px;
    background: transparent; border: 1px solid rgba(255,255,255,.14);
    color: #b7c0d1; cursor: pointer; flex-shrink: 0;
    align-items: center; justify-content: center; font-size: 14px;
  }
  .widget-logo { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; background: #eef1f4 url("/static/bot-avatar.png") center / cover no-repeat; }
  .widget-head b { font-size: 13.5px; color: #fff; }
  /* PoC→BETA 전환(2026-10-21) — 기존 아웃라인(회색 테두리만)은 눈에 잘 안 띈다는
     피드백으로, 다크 위젯 톤 안에서 또렷하게 보이는 골드 채움 배지로 변경 */
  .widget-head .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .03em;
    color: #3a2a0f; margin-left: 6px; background: #e8b872;
    border: none; border-radius: 4px; padding: 2px 7px;
  }

  /* 위젯이 넓은 화면에서 전체 너비를 다 쓰면, 유저(우측 정렬)·봇(좌측 정렬) 말풍선이
     양쪽 끝에 붙어 가운데가 휭하게 비어 보인다는 실사용 피드백(2026-10-21) — 채팅
     내용 자체를 중앙의 적당한 폭 안으로 모아 좌우 여백을 균형 있게 둔다. */
  #chat {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 20px 18px; display: flex; flex-direction: column; gap: 16px;
  }
  #chat-inner {
    display: flex; flex-direction: column; gap: 16px;
    width: 100%; max-width: 1100px; margin: 0 auto;
  }
  /* 네이티브 스크롤바는 완전히 숨김(.sidebar와 같은 이유 — 아래 .cscroll-* 커스텀 스크롤바로 대체) */
  #chat { scrollbar-width: none; }
  #chat::-webkit-scrollbar { display: none; width: 0; }

  /* ---------------- 커스텀 스크롤바(JS로 위치·크기 계산, position:fixed) ----------------
     브라우저 네이티브 스크롤바(오버레이 모드)가 CSS 폭·색 지정을 무시하는 문제를 근본적으로
     우회하기 위해, 스크롤 대상(#chat/.sidebar) 위에 완전히 별도의 트랙+섬(thumb) div를
     그려서 스크롤 위치에 맞춰 JS가 직접 좌표를 갱신한다(2026-11-17). */
  .cscroll-track {
    position: fixed;
    width: 24px;
    border-radius: 999px;
    z-index: 80;
    display: none;
  }
  .cscroll-thumb {
    position: absolute;
    left: 4px; right: 4px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s;
  }
  #chat-cscroll { background: rgba(255,255,255,.05); }
  #chat-cscroll .cscroll-thumb { background: rgba(142,160,181,.8); }
  #chat-cscroll .cscroll-thumb:hover, #chat-cscroll .cscroll-thumb.dragging { background: rgba(142,160,181,1); }
  #sidebar-cscroll { background: rgba(27,36,51,.05); }
  #sidebar-cscroll .cscroll-thumb { background: rgba(107,118,132,.65); }
  #sidebar-cscroll .cscroll-thumb:hover, #sidebar-cscroll .cscroll-thumb.dragging { background: rgba(107,118,132,.9); }

  .msg-row { display: flex; gap: 9px; max-width: min(860px, 92%); animation: fadeIn .22s ease; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  /* 근거자료(sources/details)가 붙은 답변은 말풍선 자체가 내용물 중 제일 넓은 걸 보고
     스스로 폭을 정하는(shrink-to-fit) 성질 때문에, 카드 안쪽 요소를 아무리 100%로
     맞춰도 안쪽 내용(첨부 미리보기, 펼친 이력 표)이 많아지면 말풍선 전체가 늘어난다
     (2026-10-06, 실사용 피드백 — 카드/표 레벨 고정만으로는 해결 안 됨). 근거자료가 있는
     메시지만 폭을 미리 고정해 이 체인을 끊는다. 단순 답변(근거자료 없음)은 지금처럼
     내용 길이에 맞춰 자연스럽게 좁게 유지한다. */
  .msg-row.bot.has-sources { width: min(860px, 92%); }
  .msg-row.bot.has-sources .msg-col { width: 100%; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes flashHighlight { 0% { box-shadow: 0 0 0 0 rgba(59,91,219,.6); } 100% { box-shadow: 0 0 0 9px rgba(59,91,219,0); } }
  .msg-row.flash .bubble { animation: flashHighlight .9s ease; }

  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
  }
  .avatar.bot {
    background: #eef1f4 url("/static/bot-avatar.png") center / cover no-repeat;
  }
  .avatar.user { background: #38455a; color: #cdd6e2; }

  .msg-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .msg-row.user .msg-col { align-items: flex-end; }

  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    white-space: pre-wrap; font-size: 13.3px;
  }
  .msg-row.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg-row.bot .bubble { background: var(--bot-bubble); color: var(--ink-dark); border-bottom-left-radius: 3px; }
  .bubble.error { background: var(--danger-soft); color: #ff9f9f; }

  .retry-btn {
    align-self: flex-start; background: transparent; border: 1px solid rgba(239,91,91,.4);
    color: #ff9f9f; border-radius: 8px; padding: 5px 12px; font-size: 12px;
    cursor: pointer; font-family: inherit; transition: background .15s;
  }
  .retry-btn:hover { background: var(--danger-soft); }

  /* 답변 전체·건별 상세(1번째/2번째 건...) 각각을 따로 복사할 수 있는 버튼(2026-11-18,
     실사용 피드백) — align-self로 부모가 flex-column이든 row든 늘어나지 않고 내용 크기만큼만
     차지하게 고정한다. */
  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    align-self: flex-start; flex-shrink: 0;
    background: transparent; border: 1px solid rgba(255,255,255,.14);
    color: var(--ink-dark-soft); border-radius: 7px; padding: 4px 9px;
    font-size: 11px; font-family: inherit; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .copy-btn svg { flex-shrink: 0; }
  .copy-btn:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.28); color: var(--ink-dark); }
  .copy-btn.copied { color: var(--mint); border-color: rgba(52,201,163,.45); }
  .copy-btn:disabled { cursor: default; }

  .detail-list { display: flex; flex-direction: column; gap: 5px; width: 100%; }
  .detail-row { border: 1px solid rgba(255,255,255,.08); border-radius: 9px; background: rgba(255,255,255,.02); overflow: hidden; }
  .detail-head {
    width: 100%; display: flex; align-items: baseline; gap: 8px;
    background: transparent; border: none; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--ink-dark); font-size: 12.3px; padding: 8px 11px;
  }
  .detail-head:hover { background: rgba(255,255,255,.04); }
  .detail-label { font-weight: 800; color: var(--mint); flex-shrink: 0; font-size: 11.5px; }
  .detail-teaser { color: var(--ink-dark-soft); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-chevron { color: var(--mint); flex-shrink: 0; transition: transform .15s; font-size: 13px; }
  .detail-row.open .detail-chevron { transform: rotate(90deg); }
  .detail-row.open .detail-teaser { visibility: hidden; }
  .detail-body { display: none; padding: 0 12px 11px; font-size: 12.6px; line-height: 1.65; color: var(--ink-dark-soft); }
  .detail-row.open .detail-body { display: block; }
  .detail-body-row { display: flex; align-items: flex-start; gap: 8px; }
  .detail-narrative { flex: 1; min-width: 0; }

  .sources-label { font-size: 10.5px; color: var(--ink-dark-soft); margin-top: 2px; }
  .sources { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .source-row { display: flex; flex-direction: column; align-items: flex-start; }

  /* 기관정보 카드는 "이력 보기"까지 한 상자 안에 담아, 칩과 이력보기 사이의 점선이
     다음 카드와의 경계처럼 보이던 문제를 없앤다(2026-10-06, 사용자 피드백으로 개선).
     같은 기관명이 여러 건으로 중복 등록된 경우에는 묶음 안내 띠 + 순번 배지도 더한다. */
  .source-row.org-boxed {
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 11px 12px; width: 100%;
  }
  .source-row.org-boxed .history-wrap { border-top: none; margin-top: 8px; padding-top: 0; }
  .chip-with-badge { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
  .chip-with-badge .source-chip { flex: 1; }
  .org-idx-badge {
    font-size: 10px; font-weight: 700; color: var(--mint); background: rgba(52,201,163,.14);
    border-radius: 999px; padding: 2px 8px; flex-shrink: 0;
  }
  .org-group-banner {
    background: rgba(52,201,163,.08); border: 1px solid rgba(52,201,163,.25);
    border-radius: 10px; padding: 9px 12px; width: 100%;
  }
  .org-group-banner-text { font-size: 11.3px; color: var(--ink-dark); font-weight: 600; }
  .org-group-banner-sub { font-size: 10.3px; color: var(--ink-dark-soft); margin-top: 2px; }
  .detail-source-row { margin-top: 8px; }
  .source-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.8px; background: rgba(52,201,163,.12); color: var(--mint);
    border: 1px solid rgba(52,201,163,.35); border-radius: 999px; padding: 4px 10px;
    cursor: pointer; font-family: inherit; transition: background .15s, border-color .15s;
  }
  .source-chip:hover { background: rgba(52,201,163,.22); border-color: rgba(52,201,163,.55); }
  /* 클릭하면 펼쳐진다는 걸 처음 보는 사용자도 바로 알 수 있도록 chevron 아이콘을
     달아준다(2026-10-21, 사용자 피드백: "클릭해야 하는 걸 모를 수도 있다") —
     detail-chevron(건별 상세 아코디언)과 동일한 패턴, 펼치면 90도 회전. */
  .chip-chevron { color: var(--mint); flex-shrink: 0; transition: transform .15s; font-size: 11px; }
  .source-row.open .source-chip .chip-chevron,
  .attachment-item.open .attachment-chip .chip-chevron { transform: rotate(90deg); }
  .source-preview {
    display: none; margin-top: 4px; padding: 9px 11px; width: 100%;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; font-size: 11.8px; color: var(--ink-dark-soft); line-height: 1.55; white-space: pre-wrap;
  }
  .source-row.open .source-preview { display: block; }

  .field-list {
    display: none; margin-top: 4px; width: 100%;
    border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden;
  }
  .source-row.open .field-list { display: block; }
  .field-row {
    display: flex; gap: 10px; padding: 7px 11px; font-size: 11.8px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .field-row:last-child { border-bottom: none; }
  .field-row:nth-child(even) { background: rgba(255,255,255,.02); }
  .field-label { flex: 0 0 64px; color: var(--mint); font-weight: 700; }
  .field-value { flex: 1; min-width: 0; color: var(--ink-dark-soft); line-height: 1.55; white-space: pre-wrap; }

  .attachment-list {
    display: none; margin-top: 8px; padding-top: 8px; width: 100%;
    border-top: 1px dashed rgba(255,255,255,.14);
  }
  .source-row.open .attachment-list { display: block; }
  .attachment-list-label {
    font-size: 10px; color: var(--ink-dark-soft); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .attachment-item { margin-bottom: 6px; }
  .attachment-item:last-child { margin-bottom: 0; }
  .attachment-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left;
    font-size: 10.5px; background: rgba(255,255,255,.05); color: var(--ink-dark-soft);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 4px 9px;

<script>
let sessionId = null;
let composing = false;
let currentMenuScope = null; // null = 전체(범위 없음)
let recentQuestions = [];

const shellEl = document.getElementById("shell");
const chatEl = document.getElementById("chat");
const chatInnerEl = document.getElementById("chat-inner");
const questionEl = document.getElementById("question");
const sendEl = document.getElementById("send");
const menuListEl = document.getElementById("menu-list");
const faqListEl = document.getElementById("faq-list");
const recentListEl = document.getElementById("recent-list");
const sidebarEl = document.getElementById("sidebar");
const sidebarBackdropEl = document.getElementById("sidebar-backdrop");
const menuToggleEl = document.getElementById("menu-toggle");
const keywordInputEl = document.getElementById("keyword-input");
const keywordSearchBtnEl = document.getElementById("keyword-search-btn");

// 브라우저 네이티브 스크롤바(오버레이 모드)가 CSS 폭·색 지정을 무시해서 아무리 굵게
// 키워도 화면엔 얇게 나오는 문제(2026-11-17 실사용 확인) — 네이티브 스크롤바는 완전히
// 숨기고, position:fixed인 트랙+섬(thumb) div를 JS가 스크롤 위치에 맞춰 직접 그린다.
function setupCustomScrollbar(scrollEl, track, thumb, extraVisibilityCheck) {
  let dragging = false, dragStartY = 0, dragStartTop = 0;

  function layout() {
    // position:fixed 요소(모바일 드로어의 .sidebar)는 Chrome 스펙상 offsetParent가
    // 항상 null이라 그 체크를 못 씀 — extraVisibilityCheck가 주어지면 그걸 전적으로 신뢰한다.
    const visible = extraVisibilityCheck
      ? extraVisibilityCheck()
      : getComputedStyle(scrollEl).display !== "none" && scrollEl.offsetParent !== null;
    if (!visible || scrollEl.scrollHeight <= scrollEl.clientHeight + 1) {
      track.style.display = "none";
      return;
    }
    const rect = scrollEl.getBoundingClientRect();
    track.style.display = "block";
    track.style.top = rect.top + "px";
    track.style.left = (rect.right - track.offsetWidth - 3) + "px";
    track.style.height = rect.height + "px";
    const trackH = track.clientHeight;
    const thumbH = Math.max(30, (scrollEl.clientHeight / scrollEl.scrollHeight) * trackH);
    const maxTop = trackH - thumbH;
    const range = scrollEl.scrollHeight - scrollEl.clientHeight;
    const ratio = range > 0 ? scrollEl.scrollTop / range : 0;
    thumb.style.height = thumbH + "px";
    thumb.style.top = (ratio * maxTop) + "px";
  }

  scrollEl.addEventListener("scroll", layout);
  window.addEventListener("resize", layout);
  scrollEl.addEventListener("transitionend", layout);
  new MutationObserver(layout).observe(scrollEl, { childList: true, subtree: true, characterData: true, attributes: true });
  new MutationObserver(layout).observe(shellEl, { attributes: true, attributeFilter: ["class"] });

  thumb.addEventListener("mousedown", (e) => {
    dragging = true;
    dragStartY = e.clientY;
    dragStartTop = scrollEl.scrollTop;
    thumb.classList.add("dragging");
    document.body.style.userSelect = "none";
    e.preventDefault();
  });
  track.addEventListener("mousedown", (e) => {
    if (e.target === thumb) return;
    const rect = track.getBoundingClientRect();
    const clickRatio = (e.clientY - rect.top) / rect.height;
    scrollEl.scrollTop = clickRatio * (scrollEl.scrollHeight - scrollEl.clientHeight);
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const trackH = track.clientHeight;
    const thumbH = thumb.clientHeight;
    const maxTop = trackH - thumbH;
    if (maxTop <= 0) return;
    const range = scrollEl.scrollHeight - scrollEl.clientHeight;
    scrollEl.scrollTop = dragStartTop + ((e.clientY - dragStartY) / maxTop) * range;
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    thumb.classList.remove("dragging");
    document.body.style.userSelect = "";
  });

  layout();
  return layout;
}

const DETAIL_TEASER_LEN = 42;
const RECENT_LIMIT = 5;

// 첨부 원문 추출 결과가 마크다운 표(| 칸 | 칸 |, 구분줄 |---|---|)와 <br> 줄바꿈으로
// 저장돼 있는데, 화면엔 그 기호가 그대로 텍스트로 노출되던 문제 개선 — 표 패턴을 찾으면
// 진짜 표(<table>)로, <br> 리터럴은 실제 줄바꿈으로 그려준다. 패턴이 안 맞는 부분은
// 기존처럼 그냥 텍스트로 표시(안전한 폴백, 원본 텍스트 손실 없음).
function isTableRow(line) {
  const t = line.trim();
  return t.length > 1 && t.startsWith("|") && t.endsWith("|");
}
function splitTableRow(line) {
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|")) t = t.slice(0, -1);
  return t.split("|").map(c => c.trim());
}
function isTableSeparatorRow(line) {
  if (!isTableRow(line)) return false;
  const cells = splitTableRow(line);
  return cells.length > 0 && cells.every(c => /^:?-{1,}:?$/.test(c));
}
function appendTextWithBreaks(el, text) {
  const parts = text.split(/<br\s*\/?>/i);
  parts.forEach((part, idx) => {
    if (part) el.appendChild(document.createTextNode(part));
    if (idx < parts.length - 1) el.appendChild(document.createElement("br"));
  });
}
function buildTableElement(tableLines) {
  const wrap = document.createElement("div");
  wrap.className = "extracted-table-wrap";
  const table = document.createElement("table");
  table.className = "extracted-table";

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  splitTableRow(tableLines[0]).forEach(c => {
    const th = document.createElement("th");
    appendTextWithBreaks(th, c);
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (let i = 2; i < tableLines.length; i++) {
    const tr = document.createElement("tr");
    splitTableRow(tableLines[i]).forEach(c => {
      const td = document.createElement("td");
      appendTextWithBreaks(td, c);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}
function renderRichText(container, text) {
  container.innerHTML = "";
  if (!text) return;
  const lines = text.split("\n");
  let i = 0;
  while (i < lines.length) {
    if (isTableRow(lines[i]) && lines[i + 1] !== undefined && isTableSeparatorRow(lines[i + 1])) {
      const tableLines = [lines[i], lines[i + 1]];
      let j = i + 2;
      while (j < lines.length && isTableRow(lines[j])) {
        tableLines.push(lines[j]);
        j++;
      }
      container.appendChild(buildTableElement(tableLines));
      i = j;
    } else {
      appendTextWithBreaks(container, lines[i]);
      if (i < lines.length - 1) container.appendChild(document.createElement("br"));
      i++;
    }
  }
}

function buildSourceChip(s, orgGroupMeta, opts) {
  // opts.alwaysOpen: 이미 다른 동작(표 행 클릭 등)으로 "펼쳐서 보여주겠다"는 의도가
  // 명확한 맥락에서 쓴다 — 칩 자체를 처음부터 펼친 채 고정하고 클릭 토글(화살표 포함)을
  // 아예 없앤다. 그냥 매번 chip.click()으로 강제로 펼치는 방식은 이중 토글(행 토글+칩
  // 토글)처럼 보여 "화살표를 눌러도 안 닫힌다"는 혼란을 줬다(2026-10-21, 사용자 피드백).
  const alwaysOpen = !!(opts && opts.alwaysOpen);
  const srow = document.createElement("div");
  srow.className = "source-row" + (alwaysOpen ? " open" : "");

  const chip = document.createElement("button");
  chip.className = "source-chip";
  chip.type = "button";
  const chipLabel = document.createElement("span");
  chipLabel.textContent = `[${s.데이터유형}] ${s.원본ID}` + (s.기관명 ? ` · ${s.기관명}` : "");
  chip.appendChild(chipLabel);

  // 기관정보 카드는 "이력 보기"까지 하나의 상자에 담는다(아래 해당 분기 참고). 같은
  // 기관명이 여러 건 중복 등록돼 있으면(orgGroupMeta.total > 1) 순번 배지도 붙인다.
  if (s.데이터유형 === "기관정보") {
    srow.classList.add("org-boxed");
    if (orgGroupMeta && orgGroupMeta.total > 1) {
      const chipRow = document.createElement("div");
      chipRow.className = "chip-with-badge";
      chipRow.appendChild(chip);
      const badge = document.createElement("span");
      badge.className = "org-idx-badge";
      badge.textContent = `${orgGroupMeta.index} / ${orgGroupMeta.total}`;
      chipRow.appendChild(badge);
      srow.appendChild(chipRow);
    } else {
      srow.appendChild(chip);
    }
  } else {
    srow.appendChild(chip);
  }

  let hasToggleContent = false;

  if (s.세부항목 && s.세부항목.length > 0) {
    const list = document.createElement("div");
    list.className = "field-list";
    s.세부항목.forEach(f => {
      const row = document.createElement("div");
      row.className = "field-row";

      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = f.label;
      row.appendChild(label);

      const value = document.createElement("div");
      value.className = "field-value";
      renderRichText(value, f.value);
      row.appendChild(value);

      list.appendChild(row);
    });
    srow.appendChild(list);
    hasToggleContent = true;
  } else if (s.미리보기) {
    const preview = document.createElement("div");
    preview.className = "source-preview";
    renderRichText(preview, s.미리보기);
    srow.appendChild(preview);
    hasToggleContent = true;
  }

  // 이 이력에 딸린 첨부파일 내용 — 원본ID로 연결된 첨부내용 청크가 있으면 같이 보여준다.
  // 첨부 하나하나도 독립적으로 펼쳐볼 수 있게 별도 토글을 준다.
  if (s.관련첨부 && s.관련첨부.length > 0) {
    const attList = document.createElement("div");
    attList.className = "attachment-list";

    const label = document.createElement("div");
    label.className = "attachment-list-label";
    label.textContent = `관련 첨부파일 (${s.관련첨부.length})`;
    attList.appendChild(label);

    s.관련첨부.forEach(att => {
      const item = document.createElement("div");
      item.className = "attachment-item";

      const attChip = document.createElement("button");
      attChip.className = "attachment-chip";
      attChip.type = "button";
      const attLabel = document.createElement("span");
      attLabel.textContent = att.첨부파일명;
      attChip.appendChild(attLabel);
      const attChevron = document.createElement("span");
      attChevron.className = "chip-chevron";
      attChevron.textContent = "▸";
      attChip.appendChild(attChevron);
      item.appendChild(attChip);

      const attPreview = document.createElement("div");
      attPreview.className = "attachment-preview";
      renderRichText(attPreview, att.미리보기);
      item.appendChild(attPreview);

      // 요약/상세 토글과 다운로드 링크를 한 행(modeBtns)에 같이 담는다 — 둘 다 같은
      // 줄·같은 크기로 보이길 원한다는 사용자 요청(2026-11-05). 경로전용(내용 없는
      // SQL/카탈로그성) 첨부는 토글 없이 다운로드만, 일반 첨부는 토글+(파일경로 있으면)
      // 다운로드까지 같이 들어갈 수 있다.
      const modeBtns = document.createElement("div");
      modeBtns.className = "attachment-mode-btns";

      if (!att.경로전용) {
        // "요약"(기본, 사전 생성)/"상세"(클릭 시 실시간 생성) 토글 — 상세는 처음 누를
        // 때만 서버에 요청하고 결과를 캐시해 재조회하지 않는다("이력 보기" 버튼과 동일
        // 패턴). 요약으로 돌아가면 다시 렌더링 없이 원래 미리보기를 그대로 보여준다.
        const summaryBtn = document.createElement("button");
        summaryBtn.className = "attachment-mode-btn active";
        summaryBtn.type = "button";
        summaryBtn.textContent = "요약";
        const detailBtn = document.createElement("button");
        detailBtn.className = "attachment-mode-btn";
        detailBtn.type = "button";
        detailBtn.textContent = "상세";
        modeBtns.appendChild(summaryBtn);
        modeBtns.appendChild(detailBtn);

        const summaryText = att.미리보기;
        let detailText = null;
        let detailLoading = false;

        summaryBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          summaryBtn.classList.add("active");
          detailBtn.classList.remove("active");
          renderRichText(attPreview, summaryText);
        });

        detailBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          summaryBtn.classList.remove("active");
          detailBtn.classList.add("active");
          if (detailText !== null) {
            renderRichText(attPreview, detailText);
            return;
          }
          if (detailLoading) return;
          detailLoading = true;
          attPreview.textContent = "상세 내용을 생성하는 중...";
          try {
            const params = new URLSearchParams({
              data_type: s.데이터유형, source_id: s.원본ID, filename: att.첨부파일명,
            });
            const res = await fetch(`/attachment-detail?${params.toString()}`);
            const data = await res.json();
            detailText = data.상세 || "상세 내용을 생성하지 못했습니다.";
          } catch (err) {
            detailText = "상세 내용을 불러오지 못했습니다.";
          }
          detailLoading = false;
          // 버튼 전환 사이에 사용자가 다시 "요약"을 눌렀을 수 있으니, 여전히 상세가
          // 선택된 상태일 때만 반영한다.
          if (detailBtn.classList.contains("active")) {
            renderRichText(attPreview, detailText);
          }
        });
      }

      // 파일경로가 있으면(경로전용·일반 첨부 모두) 원본 다운로드 링크를 같은 행에
      // 추가한다. attPreview 안에 넣으면 위 토글의 renderRichText가 매번
      // attPreview.innerHTML을 통째로 지워서 같이 사라지므로, modeBtns(item 직속)에 붙인다.
      if (att.파일경로) {
        const downloadLink = document.createElement("a");
        downloadLink.className = "attachment-download-link";
        downloadLink.href = `/attachment-download?file_path=${encodeURIComponent(att.파일경로)}&display_name=${encodeURIComponent(att.첨부파일명 || "")}`;
        downloadLink.textContent = "파일 다운로드";
        downloadLink.addEventListener("click", (e) => e.stopPropagation());
        modeBtns.appendChild(downloadLink);
      }

      if (modeBtns.children.length > 0) {
        item.appendChild(modeBtns);
      }

      attChip.addEventListener("click", (e) => {
        e.stopPropagation();
        item.classList.toggle("open");
      });

      attList.appendChild(item);
    });

    srow.appendChild(attList);
    hasToggleContent = true;
  }

  // 기관정보 카드엔 "이력 보기" 버튼을 둔다 — 그 기관의 신청이력 전체를 top-K 제한 없이
  // 코드가 직접 날짜+제목+원본ID 표로 렌더링한다(LLM 서술 없음, 이력이 많은 기관도 완전한
  // 목록 보장). 클릭 시에만 조회(지연 로딩)하고 한 번 불러오면 캐시해서 재조회 안 함.
  if (s.데이터유형 === "기관정보") {
    const histWrap = document.createElement("div");
    histWrap.className = "history-wrap";

    const histBtn = document.createElement("button");
    histBtn.className = "history-toggle-btn";
    histBtn.type = "button";
    const histBtnLabel = document.createElement("span");
    histBtnLabel.textContent = "이력 보기";
    histBtn.appendChild(histBtnLabel);
    const histBtnChevron = document.createElement("span");
    histBtnChevron.className = "chip-chevron";
    histBtnChevron.textContent = "▸";
    histBtn.appendChild(histBtnChevron);
    histWrap.appendChild(histBtn);

    const histBody = document.createElement("div");
    histBody.className = "history-body";
    histWrap.appendChild(histBody);

    let loaded = false;
    histBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      histWrap.classList.toggle("open");
      if (histWrap.classList.contains("open") && !loaded) {
        loaded = true;
        histBody.textContent = "불러오는 중...";
        try {
          const res = await fetch(`/organization-history?organization_id=${encodeURIComponent(s.원본ID)}`);
          const data = await res.json();
          renderHistoryTable(histBody, data.items || []);
        } catch (err) {
          histBody.textContent = "이력을 불러오지 못했습니다.";
        }
      }
    });

    srow.appendChild(histWrap);
    hasToggleContent = true;
  }

  if (hasToggleContent && !alwaysOpen) {
    const chevron = document.createElement("span");
    chevron.className = "chip-chevron";
    chevron.textContent = "▸";
    chip.appendChild(chevron);
    chip.addEventListener("click", (e) => {
      e.stopPropagation();
      srow.classList.toggle("open");
    });
  } else {
    chip.style.cursor = "default";
  }
  return srow;
}

// 같은 기관명으로 중복 등록된 기관정보 카드들 바로 위에 붙는 안내 띠 — "왜 같은 기관명
// 카드가 여러 장 나오는지"를 화면에서 바로 설명한다(2026-10-06, 사용자 피드백 반영).
function buildOrgGroupBanner(orgName, count) {
  const banner = document.createElement("div");
  banner.className = "org-group-banner";

  const title = document.createElement("div");
  title.className = "org-group-banner-text";
  title.textContent = `${orgName} · 중복 등록 ${count}건`;
  banner.appendChild(title);

  const sub = document.createElement("div");
  sub.className = "org-group-banner-sub";
  sub.textContent = "같은 기관을 서로 다른 목적으로 각각 등록한 건입니다";
  banner.appendChild(sub);

  return banner;
}

// 기관명이 같은 기관정보 카드가 여러 개(중복 등록)면, 원래 순서와 무관하게 한데 모아
// 묶음 안내 띠 밑에 순서대로 배치한다 — 그 외(단독 기관정보, 다른 데이터유형)는 원래
// 순서 그대로 둔다(2026-10-06).
function appendGroupedSources(box, sources) {
  const orgNameCounts = {};
  sources.forEach(s => {
    if (s.데이터유형 === "기관정보" && s.기관명) {
      orgNameCounts[s.기관명] = (orgNameCounts[s.기관명] || 0) + 1;
    }
  });

  const renderedGroups = new Set();
  sources.forEach(s => {
    if (s.데이터유형 === "기관정보" && s.기관명 && orgNameCounts[s.기관명] > 1) {
      if (renderedGroups.has(s.기관명)) return; // 이미 묶어서 출력한 그룹
      renderedGroups.add(s.기관명);
      const group = sources.filter(x => x.데이터유형 === "기관정보" && x.기관명 === s.기관명);
      box.appendChild(buildOrgGroupBanner(s.기관명, group.length));
      group.forEach((g, i) => box.appendChild(buildSourceChip(g, { index: i + 1, total: group.length })));
    } else {
      box.appendChild(buildSourceChip(s));
    }
  });
}

function renderHistoryTable(container, items) {
  container.innerHTML = "";
  if (items.length === 0) {
    container.textContent = "등록된 신청이력이 없습니다.";
    return;
  }
  const countLabel = document.createElement("div");
  countLabel.className = "history-count-label";
  countLabel.textContent = `총 ${items.length}건 (행을 클릭하면 상세 내용을 볼 수 있습니다)`;
  container.appendChild(countLabel);

  const table = document.createElement("table");
  table.className = "extracted-table history-table";

  // 칼럼폭을 미리 고정해둔다(table-layout:fixed는 내용이 아니라 이 비율만 본다) —
  // 신청일(짧은 고정 길이)·원본ID(고정 길이)는 좁게, 요청구분(가변 길이)은 넓게.
  // 사업명 대신 요청구분을 보여주는 이유: 같은 기관의 반복 계약은 사업명이 전부 동일해서
  // (예: 한국환경공단 83건 전부 "수입통계자료 제공 서비스 계약") 목록만 봐서는 어떤 행이
  // 어떤 건인지 구분이 안 되는데, 요청구분은 건별로 거의 다 다르다(2026-11-05 사용자 제보).
  const colgroup = document.createElement("colgroup");
  [13, 63, 24].forEach(pct => {
    const col = document.createElement("col");
    col.style.width = pct + "%";
    colgroup.appendChild(col);
  });
  table.appendChild(colgroup);

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  ["신청일", "요청구분", "원본ID"].forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  items.forEach(it => {
    const tr = document.createElement("tr");
    tr.className = "history-row";
    [it.신청일 || "-", it.요청구분 || "-", it.원본ID].forEach((v, idx) => {
      const td = document.createElement("td");
      if (idx === 2) {
        // 원본ID 칸에 클릭 가능 표시(chevron) 추가 — 행 전체가 클릭 영역이라
        // 마지막 칸에 두면 표 오른쪽 끝에서 자연스럽게 눈에 띈다.
        const wrap = document.createElement("div");
        wrap.className = "history-row-id-wrap";
        const idLabel = document.createElement("span");
        idLabel.textContent = v;
        wrap.appendChild(idLabel);
        const chevron = document.createElement("span");
        chevron.className = "chip-chevron";
        chevron.textContent = "▸";
        wrap.appendChild(chevron);
        td.appendChild(wrap);
      } else {
        td.textContent = v;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    // 행 하나를 누르면 그 건의 상세(세부항목 표+관련첨부)를 메인 근거자료 카드와
    // 완전히 같은 형태로 지연 조회해서 바로 아래에 펼친다. 목록 전체를 미리 다
    // 조회하지 않아 이력이 많은 기관도 초기 로딩이 느려지지 않는다.
    const detailTr = document.createElement("tr");
    detailTr.className = "history-detail-row";
    detailTr.hidden = true;
    const detailTd = document.createElement("td");
    detailTd.colSpan = 3;
    detailTr.appendChild(detailTd);
    tbody.appendChild(detailTr);

    let loaded = false;
    tr.addEventListener("click", async () => {
      const opening = detailTr.hidden;
      detailTr.hidden = !opening;
      tr.classList.toggle("open", opening);
      if (opening && !loaded) {
        loaded = true;
        detailTd.textContent = "불러오는 중...";
        try {
          const res = await fetch(`/record-detail?data_type=신청이력&source_id=${encodeURIComponent(it.원본ID)}`);
          if (!res.ok) throw new Error("not found");
          const source = await res.json();
          detailTd.innerHTML = "";
          // 이미 행을 클릭했으니 한 번 더 누르지 않아도 바로 펼쳐서 보여준다 — 칩 자체의
          // 독립 토글(화살표)은 끈다(alwaysOpen), 행 토글과 칩 토글이 중첩되면 "화살표를
          // 눌러도 안 닫힌다"는 혼란을 준다(2026-10-21, 사용자 피드백).
          const sourceRow = buildSourceChip(source, null, { alwaysOpen: true });
          detailTd.appendChild(sourceRow);
        } catch (err) {
          detailTd.textContent = "상세 내용을 불러오지 못했습니다.";
        }
      }
    });
  });
  table.appendChild(tbody);

  const wrap = document.createElement("div");
  wrap.className = "extracted-table-wrap";
  wrap.appendChild(table);
  container.appendChild(wrap);
}

const MENU_ITEMS = ["전체", "기관별 사업정보", "외부요청", "내부자료", "심의위원회", "첨부파일"];

// "승인불가"는 더미 데이터 시절 표현 — 실데이터(2026-08-18 전환) 심의결과엔 그 값이
// 없고 "제공불가"가 그 역할이라, FAQ 버튼 자체가 항상 "찾지 못함"으로 실패하고 있었음
// (2026-10-15 즉흥 테스트로 발견)
const FAQ_ITEMS = [
  "이력관리시스템에 등록된 업체명 목록을 전부 알려줘",
  "외부요청으로 등록된 업체명을 알려줘",
  "내부자료 담당자 이름 목록을 알려줘",
  "심의위원회에서 제공불가된 안건을 알려줘",
  "국가 항목을 요청한 업체를 알려줘",
  "첨부파일 중에 보안 점검 관련 내용이 있을까?",
];

function closeSidebarOnMobile() {
  shellEl.classList.remove("sidebar-open");
}

function renderMenuList() {
  menuListEl.innerHTML = "";
  MENU_ITEMS.forEach(label => {
    const btn = document.createElement("button");
    btn.className = "side-item" + ((currentMenuScope || "전체") === label ? " active" : "");
    btn.type = "button";
    btn.textContent = label;
    btn.addEventListener("click", () => {
      setMenuScope(label);
      closeSidebarOnMobile();
    });
    menuListEl.appendChild(btn);
  });
}

function setMenuScope(label) {
  currentMenuScope = label === "전체" ? null : label;
  renderMenuList();
}

function renderFaqList() {
  faqListEl.innerHTML = "";
  FAQ_ITEMS.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "side-item faq-item";
    btn.type = "button";
    btn.textContent = q;
    btn.addEventListener("click", () => {
      closeSidebarOnMobile();
      submitQuestion(q);
    });
    faqListEl.appendChild(btn);
  });
}

function renderRecentList() {
  recentListEl.innerHTML = "";
  if (recentQuestions.length === 0) {
    const empty = document.createElement("div");
    empty.className = "side-empty";
    empty.textContent = "아직 검색 기록이 없습니다";
    recentListEl.appendChild(empty);
    return;
  }
  recentQuestions.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "side-recent";
    btn.type = "button";
    btn.textContent = item.q;
    btn.addEventListener("click", () => {
      closeSidebarOnMobile();
      jumpToMessage(item.rowEl);
    });
    recentListEl.appendChild(btn);
  });
}

function jumpToMessage(rowEl) {
  if (!rowEl || !rowEl.isConnected) return;
  rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
  rowEl.classList.add("flash");
  setTimeout(() => rowEl.classList.remove("flash"), 900);
}

function pushRecentQuestion(q, rowEl) {
  recentQuestions = [{ q, rowEl }, ...recentQuestions.filter(item => item.q !== q)].slice(0, RECENT_LIMIT);
  renderRecentList();
}

// 답변 전체 또는 건별 상세(1번째/2번째 건...) 하나만 클립보드로 복사하는 버튼(2026-11-18,
// 실사용 피드백). getText는 클릭 시점에 복사할 텍스트를 반환하는 함수 — DOM 생성 시점에
// 텍스트를 미리 고정하지 않고 클로저로 늦게 평가해, 나중에 내용이 바뀌어도 안전하다.
function createCopyButton(getText) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "copy-btn";
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>복사</span>';
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const text = getText();
    let ok = true;
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (err2) {
        ok = false;
      }
    }
    const label = btn.querySelector("span");
    const original = label.textContent;
    label.textContent = ok ? "복사됨" : "복사 실패";
    btn.classList.toggle("copied", ok);
    btn.disabled = true;
    setTimeout(() => {
      label.textContent = original;
      btn.classList.remove("copied");
      btn.disabled = false;
    }, 1400);
  });
  return btn;
}

function addMessage(role, text, sources, isError, retryQuestion, details) {
  const row = document.createElement("div");
  const hasEvidence = (sources && sources.length > 0) || (details && details.length > 0);
  row.className = "msg-row " + role + (hasEvidence ? " has-sources" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar " + role;
  if (role === "user") avatar.textContent = "나";
  row.appendChild(avatar);

  const col = document.createElement("div");
  col.className = "msg-col";

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " error" : "");
  bubble.textContent = text;
  col.appendChild(bubble);

  // 답변 전체 복사 — 에러 메시지("다시 시도" 버튼이 뜨는 경우)는 복사할 실제 답변이
  // 아니므로 제외, 사용자 메시지는 이미 화면에 그대로 보이므로 대상 아님. 건별 상세
  // (1번째 건/2번째 건...)가 있으면 각 건을 펼쳐보지 않아도 요약 밑에 함께 복사되도록,
  // 화면에 보이는 축약 티저가 아니라 전체 narrative를 이어 붙인다(실사용 피드백 2026-11-18
  // — "안에 들어가서 보는 내용까지는 필요 없다"는 근거자료 카드는 빼고 서술 텍스트만).
  // 근거자료가 하나도 없는 메시지("관련 이력을 찾지 못했습니다" 류 거절·안내, 첫 인사말
  // 등)는 애초에 복사할 실질 내용이 없으니 버튼 자체를 안 보여준다(실사용 피드백,
  // 2026-11-18 — "찾지 못했다 같은 건 복사 버튼이 안 보여도 되지 않냐").
  if (role === "bot" && !isError && hasEvidence) {
    col.appendChild(createCopyButton(() => {
      if (!details || details.length === 0) return text;
      const detailText = details.map(d => `${d.label}: ${d.narrative}`).join("\n\n");
      return text + "\n\n" + detailText;
    }));
  }

  if (isError && retryQuestion) {
    const retryBtn = document.createElement("button");
    retryBtn.className = "retry-btn";
    retryBtn.textContent = "다시 시도";
    retryBtn.addEventListener("click", () => {
      row.remove();
      callChat(retryQuestion);
    });
    col.appendChild(retryBtn);
  }

  if (details && details.length > 0) {
    const list = document.createElement("div");
    list.className = "detail-list";
    details.forEach(d => {
      const drow = document.createElement("div");
      drow.className = "detail-row" + (details.length === 1 ? " open" : "");

      const head = document.createElement("button");
      head.className = "detail-head";
      head.type = "button";

      const label = document.createElement("span");
      label.className = "detail-label";
      label.textContent = d.label;
      head.appendChild(label);

      const teaser = document.createElement("span");
      teaser.className = "detail-teaser";
      teaser.textContent = d.narrative.length > DETAIL_TEASER_LEN
        ? d.narrative.slice(0, DETAIL_TEASER_LEN) + "…"
        : d.narrative;
      head.appendChild(teaser);

      const chevron = document.createElement("span");
      chevron.className = "detail-chevron";
      chevron.textContent = "▸";
      head.appendChild(chevron);

      drow.appendChild(head);

      const body = document.createElement("div");
      body.className = "detail-body";

      const narrativeRow = document.createElement("div");
      narrativeRow.className = "detail-body-row";

      const narrative = document.createElement("div");
      narrative.className = "detail-narrative";
      narrative.textContent = d.narrative;
      narrativeRow.appendChild(narrative);
      narrativeRow.appendChild(createCopyButton(() => d.narrative));

      body.appendChild(narrativeRow);

      if (d.source) {
        const srow = buildSourceChip(d.source);
        srow.classList.add("detail-source-row");
        body.appendChild(srow);
      }

      drow.appendChild(body);

      head.addEventListener("click", () => drow.classList.toggle("open"));
      list.appendChild(drow);
    });
    col.appendChild(list);
  }

  // 근거자료가 건별 상세(details) 안에 이미 각각 붙어있으면, 맨 아래에 뭉쳐서
  // 또 보여줄 필요가 없다 — 상세 항목이 없는 좁은 질문(단일 사실 답변)일 때만 표시
  if (sources && sources.length > 0 && !(details && details.length > 0)) {
    const label = document.createElement("div");
    label.className = "sources-label";
    label.textContent = "근거 자료 (클릭하면 내용 미리보기)";
    col.appendChild(label);

    const box = document.createElement("div");
    box.className = "sources";
    appendGroupedSources(box, sources);
    col.appendChild(box);
  }

  row.appendChild(col);
  chatInnerEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "typing-indicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar bot";
  row.appendChild(avatar);

  const el = document.createElement("div");
  el.className = "typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  row.appendChild(el);

  chatInnerEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function autoResize() {
  questionEl.style.height = "auto";
  questionEl.style.height = Math.min(questionEl.scrollHeight, 110) + "px";
}

async function callChat(question) {
  sendEl.disabled = true;
  addTyping();
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId, menu_scope: currentMenuScope }),
    });
    removeTyping();

    if (!resp.ok) {
      addMessage("bot", `오류가 발생했습니다. (HTTP ${resp.status})`, null, true, question);
      return;
    }

    const data = await resp.json();
    sessionId = data.session_id;
    addMessage("bot", data.answer, data.sources, false, null, data.details);
  } catch (err) {
    removeTyping();
    addMessage("bot", "서버에 연결할 수 없습니다.", null, true, question);
  } finally {
    sendEl.disabled = false;
    questionEl.focus();
  }
}

function submitQuestion(question) {
  const row = addMessage("user", question);
  pushRecentQuestion(question, row);
  callChat(question);
}

function sendQuestion() {
  // 전송 버튼은 요청 처리 중 disabled=true로 막히지만, Enter 키 제출 경로(아래
  // keydown 핸들러)는 이 상태를 확인하지 않아서 응답을 기다리는 도중에도 Enter로
  // 다음 질문을 연달아 보낼 수 있었다(2026-10-15, 브라우저 자동화로 빠르게 연속
  // 질문하다가 발견 — 같은 세션에 두 요청이 겹쳐 들어가며 대화 기록이 꼬여 보이는
  // 증상 재현). 버튼 클릭이든 Enter든 전부 이 함수를 거치니 여기서 한 번만 막으면 된다.
  if (sendEl.disabled) return;
  const question = questionEl.value.trim();
  if (!question) return;
  questionEl.value = "";
  autoResize();
  submitQuestion(question);
}

sendEl.addEventListener("click", sendQuestion);
questionEl.addEventListener("input", autoResize);
questionEl.addEventListener("compositionstart", () => { composing = true; });
questionEl.addEventListener("compositionend", () => { composing = false; });
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    if (composing || e.isComposing) return;
    e.preventDefault();
    sendQuestion();
  }
});

// 한글 마지막 글자의 받침 유무로 조사를 고른다(2026-11-12, 배치 테스트 중 "통관가"/
// "지식재산권가"처럼 받침 있는 단어에 받침 없는 조사가 붙는 어색한 표현 발견) — ㄹ받침은
// "으로"가 아니라 "로"를 쓰는 예외도 반영. 한글이 아닌 글자(영문/숫자)로 끝나면 받침 없는
// 쪽을 기본값으로 쓴다.
function koreanJosa(word, withBatchim, withoutBatchim) {
  const ch = (word || "").trim().slice(-1);
  const code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) {
    const finalCode = (code - 0xAC00) % 28;
    if (finalCode === 0) return withoutBatchim;
    if (withBatchim === "으로" && finalCode === 8) return "로"; // ㄹ받침 예외
    return withBatchim;
  }
  return withoutBatchim;
}

// "빠른 검색" — 자연어 질문분석·답변 생성 LLM을 전혀 거치지 않고, 입력한 단어가 실제로
// 포함된 자료를 그대로 /keyword-search로 조회해 소스카드로 보여준다(2026-11-12).
async function callKeywordSearch(keyword) {
  keywordSearchBtnEl.disabled = true;
  addTyping();
  try {
    const params = new URLSearchParams({ keyword });
    if (currentMenuScope) params.set("menu_scope", currentMenuScope);
    const resp = await fetch("/keyword-search?" + params.toString());
    removeTyping();

    if (!resp.ok) {
      addMessage("bot", `오류가 발생했습니다. (HTTP ${resp.status})`, null, true);
      return;
    }

    const data = await resp.json();
    let text;
    if (data.count === 0) {
      text = `"${keyword}"${koreanJosa(keyword, "이", "가")} 포함된 자료를 찾지 못했습니다.`;
    } else if (data.keyword !== keyword) {
      text = `"${keyword}"${koreanJosa(keyword, "으로", "로")}는 찾지 못해 "${data.keyword}"${koreanJosa(data.keyword, "으로", "로")} 좁혀 찾았습니다. 총 ${data.count}건입니다.`;
    } else {
      text = `"${data.keyword}"${koreanJosa(data.keyword, "이", "가")} 포함된 자료 ${data.count}건을 찾았습니다.`;
    }
    if (data.truncated) text += " (검색 상한에 걸려 더 있을 수 있습니다)";
    addMessage("bot", text, data.sources);
  } catch (err) {
    removeTyping();
    addMessage("bot", "서버에 연결할 수 없습니다.", null, true);
  } finally {
    keywordSearchBtnEl.disabled = false;
  }
}

function sendKeywordSearch() {
  if (keywordSearchBtnEl.disabled) return;
  const keyword = keywordInputEl.value.trim();
  if (!keyword) return;
  const row = addMessage("user", `키워드 검색: ${keyword}`);
  pushRecentQuestion(`키워드 검색: ${keyword}`, row);
  keywordInputEl.value = "";
  callKeywordSearch(keyword);
}

keywordSearchBtnEl.addEventListener("click", sendKeywordSearch);
keywordInputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendKeywordSearch();
  }
});

menuToggleEl.addEventListener("click", () => shellEl.classList.toggle("sidebar-open"));
sidebarBackdropEl.addEventListener("click", closeSidebarOnMobile);

renderMenuList();
renderFaqList();
renderRecentList();

addMessage("bot", "안녕하세요. 이력관리시스템 챗봇입니다. 기관명, 연도, 담당자·요청자, 심의결과 등으로 이력을 검색할 수 있습니다. 왼쪽 메뉴에서 범위를 고르시거나, 궁금한 점을 바로 입력해보세요.");

const chatScrollLayout = setupCustomScrollbar(
  chatEl,
  document.getElementById("chat-cscroll"),
  document.getElementById("chat-cscroll-thumb"),
);
const sidebarScrollLayout = setupCustomScrollbar(
  sidebarEl,
  document.getElementById("sidebar-cscroll"),
  document.getElementById("sidebar-cscroll-thumb"),
  () => window.innerWidth > 720 || shellEl.classList.contains("sidebar-open"),
);
setTimeout(() => { chatScrollLayout(); sidebarScrollLayout(); }, 300);
</script>
